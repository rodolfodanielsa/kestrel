<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encomendas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Encomendas">
<meta name="theme-color" content="#0f2f27">
<style>
  :root { --abeto: #0f2f27; --abeto-2: #17433a; --papel: #f1f4ee; --tinta: #1d2a25; --ambar: #f4b942; --arando: #b3213b; --verde: #2f7d4f; --suave: #5b6b64; }
  * { box-sizing: border-box; }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 0 14px calc(32px + env(safe-area-inset-bottom)); max-width: 640px; margin-inline: auto; background: var(--abeto); color: var(--papel); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: calc(12px + env(safe-area-inset-top)) 0 12px; background: var(--abeto); }
  h1 { font: 700 1.6rem ui-serif, Georgia, serif; margin: 0; flex: 1; letter-spacing: -.01em; }
  button, select, input, textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; }
  button { background: var(--abeto-2); color: var(--papel); border-color: #2d5a4f; min-height: 44px; }
  #new { background: var(--ambar); color: #2a1d00; font-weight: 700; border: 0; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, li:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
  #status { flex-basis: 100%; color: #9fb8ae; font-size: .85rem; min-height: 1.2em; }
  #divida { margin: 0 0 12px; color: var(--ambar); font: 700 1.1rem ui-serif, Georgia, serif; }
  #divida:empty { display: none; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  #status:empty { display: none; }
  .filters select { flex: 1; min-width: 0; background: var(--abeto-2); color: var(--papel); border-color: #2d5a4f; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { position: relative; background: var(--papel); color: var(--tinta); border-radius: 6px 14px 14px 6px; padding: 12px 14px 12px 22px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; cursor: pointer; border-left: 8px solid var(--est, #9aa8a1); }
  li::before { content: ''; position: absolute; left: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--abeto); }
  li strong { font-size: 1.05rem; }
  .price { font: 700 1.35rem ui-serif, Georgia, serif; text-align: right; }
  li div { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  li small { grid-column: 1 / -1; color: var(--suave); }
  .badge { background: #dde5df; border-radius: 12px; padding: 2px 10px; font-size: .85rem; }
  .badge.ok { background: #cfe9d6; color: #174d2c; } .badge.warn { background: #f7d9de; color: #7d1428; }
  #empty { text-align: center; color: #9fb8ae; padding: 32px 0; }
  dialog { border: 0; border-radius: 16px; background: var(--papel); color: var(--tinta); padding: 18px; width: min(92vw, 440px); }
  dialog::backdrop { background: rgba(5, 20, 16, .7); }
  dialog h2 { font: 700 1.3rem ui-serif, Georgia, serif; margin: 0 0 4px; }
  dialog form { display: grid; gap: 10px; }
  dialog input, dialog select, dialog textarea { background: #fff; border-color: #c5d0c9; color: var(--tinta); }
  dialog button { background: #dde5df; color: var(--tinta); border-color: #c5d0c9; }
  dialog button[type=submit] { background: var(--abeto-2); color: var(--papel); border: 0; font-weight: 700; }
  label { display: grid; gap: 2px; font-size: .9rem; color: var(--suave); }
  label.row { display: flex; gap: 8px; align-items: center; }
  label input[type=checkbox] { width: 22px; height: 22px; padding: 0; }
  #errors { color: var(--arando); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>Encomendas</h1>
  <button id="new">+ Nova</button>
  <button id="sync">Sincronizar</button>
  <button id="settings-btn" aria-label="Definições">⚙</button>
  <span id="status" role="status"></span>
</header>
<p id="divida"></p>
<div class="filters">
  <select id="f-estado" aria-label="Filtrar por estado"><option value="todos">Todos os estados</option></select>
  <select id="f-pago" aria-label="Filtrar por pagamento">
    <option value="todos">Pago e não pago</option><option value="pago">Pago</option><option value="nao">Não pago</option>
  </select>
</div>
<ul id="list"></ul>
<p id="empty" hidden>Sem encomendas.</p>

<dialog id="dlg">
  <form id="order-form" method="dialog" novalidate>
    <h2 id="form-title"></h2>
    <label>Cliente <input id="cliente" required></label>
    <label>Modelo <input id="modelo" list="catalogo" required></label>
    <datalist id="catalogo"></datalist>
    <label>Quantidade <input id="quantidade" inputmode="numeric"></label>
    <label>Preço total (€) <input id="preco" inputmode="decimal"></label>
    <label>Estado <select id="estado"></select></label>
    <label class="row"><input type="checkbox" id="pago"> Pago</label>
    <label>Notas <textarea id="notas" rows="3"></textarea></label>
    <div id="errors" role="alert"></div>
    <div class="actions">
      <button type="button" id="archive"></button>
      <button type="button" id="cancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="sdlg">
  <form id="settings-form" method="dialog">
    <h2>Definições de sync</h2>
    <label>URL do web app <input id="url" type="url" autocomplete="off"></label>
    <label>Segredo <input id="secret" type="password" autocomplete="off"></label>
    <label>Catálogo (CSV) <input id="csv" type="file" accept=".csv,text/csv"></label>
    <small id="cat-info"></small>
    <div class="actions"><button type="submit">Guardar</button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
